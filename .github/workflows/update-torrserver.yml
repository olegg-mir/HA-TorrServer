name: Build and update TorrServer

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "torrserver/Dockerfile"
      - "torrserver/run.sh"
      - "torrserver/patches/**"
      - "torrserver/package-version.txt"
      - ".github/workflows/update-torrserver.yml"

permissions:
  contents: write
  packages: write

concurrency:
  group: build-and-update-torrserver
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Home Assistant repository
        uses: actions/checkout@v4

      - name: Resolve versions
        id: versions
        shell: bash
        run: |
          set -euo pipefail

          upstream_tag="$(curl -fsSL             -H 'Accept: application/vnd.github+json'             -H 'X-GitHub-Api-Version: 2022-11-28'             https://api.github.com/repos/YouROK/TorrServer/releases/latest             | jq -r '.tag_name // empty')"

          if [[ -z "$upstream_tag" || "$upstream_tag" != MatriX.* ]]; then
            echo "Unexpected upstream release tag: ${upstream_tag:-<empty>}" >&2
            exit 1
          fi

          package_version="$(tr -d '[:space:]' < torrserver/package-version.txt)"
          if [[ -z "$package_version" ]]; then
            echo "torrserver/package-version.txt is empty" >&2
            exit 1
          fi

          target_version="${package_version}-${upstream_tag}"
          current_version="$(sed -n 's/^version: "\(.*\)"$/\1/p' torrserver/config.yaml)"

          echo "upstream_tag=$upstream_tag" >> "$GITHUB_OUTPUT"
          echo "package_version=$package_version" >> "$GITHUB_OUTPUT"
          echo "target_version=$target_version" >> "$GITHUB_OUTPUT"
          echo "current_version=$current_version" >> "$GITHUB_OUTPUT"

          echo "Upstream: $upstream_tag"
          echo "Target Home Assistant version: $target_version"
          echo "Current Home Assistant version: $current_version"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether target image already exists
        id: image
        shell: bash
        env:
          TARGET_VERSION: ${{ steps.versions.outputs.target_version }}
        run: |
          set -euo pipefail

          image="ghcr.io/olegg-mir/ha-torrserver:${TARGET_VERSION}"
          if docker manifest inspect "$image" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Image already exists: $image"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Image needs to be built: $image"
          fi

      - name: Decide whether to build
        id: decision
        shell: bash
        env:
          IMAGE_EXISTS: ${{ steps.image.outputs.exists }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "push" || "$IMAGE_EXISTS" != "true" ]]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout upstream TorrServer release
        if: steps.decision.outputs.build == 'true'
        uses: actions/checkout@v4
        with:
          repository: YouROK/TorrServer
          ref: ${{ steps.versions.outputs.upstream_tag }}
          path: torrserver/src
          fetch-depth: 1

      - name: Verify and apply Home Assistant patches
        if: steps.decision.outputs.build == 'true'
        shell: bash
        run: |
          set -euo pipefail

          for patch in torrserver/patches/*.patch; do
            echo "Checking $patch"
            git -C torrserver/src apply --check "$GITHUB_WORKSPACE/$patch"
          done

          for patch in torrserver/patches/*.patch; do
            echo "Applying $patch"
            git -C torrserver/src apply "$GITHUB_WORKSPACE/$patch"
          done

      - name: Set up QEMU
        if: steps.decision.outputs.build == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.decision.outputs.build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and publish Home Assistant image
        if: steps.decision.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: torrserver
          file: torrserver/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/olegg-mir/ha-torrserver:${{ steps.versions.outputs.target_version }}
          build-args: |
            TORRSERVER_VERSION=${{ steps.versions.outputs.upstream_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Home Assistant metadata
        id: metadata
        shell: bash
        env:
          TARGET_VERSION: ${{ steps.versions.outputs.target_version }}
          CURRENT_VERSION: ${{ steps.versions.outputs.current_version }}
          UPSTREAM_TAG: ${{ steps.versions.outputs.upstream_tag }}
        run: |
          set -euo pipefail

          if [[ "$CURRENT_VERSION" == "$TARGET_VERSION" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          sed -i "s/^version: .*/version: \"${TARGET_VERSION}\"/" torrserver/config.yaml

          today="$(date -u +%Y-%m-%d)"
          tmp="$(mktemp)"
          {
            printf '## %s - %s\n\n' "$TARGET_VERSION" "$today"
            printf -- '- Updated upstream TorrServer to [%s](https://github.com/YouROK/TorrServer/releases/tag/%s).\n\n' "$UPSTREAM_TAG" "$UPSTREAM_TAG"
            cat torrserver/CHANGELOG.md
          } > "$tmp"
          mv "$tmp" torrserver/CHANGELOG.md

          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit metadata update
        if: steps.metadata.outputs.changed == 'true'
        shell: bash
        env:
          TARGET_VERSION: ${{ steps.versions.outputs.target_version }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add torrserver/config.yaml torrserver/CHANGELOG.md
          git commit -m "chore: update TorrServer to ${TARGET_VERSION}"
          git push
