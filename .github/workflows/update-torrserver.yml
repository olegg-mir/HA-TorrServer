name: Build and update TorrServer

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "torrserver/Dockerfile"
      - "torrserver/run.sh"
      - "torrserver/patches/**"
      - "torrserver/package-version.txt"
      - ".github/workflows/update-torrserver.yml"

permissions:
  contents: write
  packages: write

concurrency:
  group: build-and-update-torrserver
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Home Assistant repository
        uses: actions/checkout@v7.0.1

      - name: Resolve versions
        id: versions
        shell: bash
        run: |
          set -euo pipefail

          upstream_release_json="$RUNNER_TEMP/upstream-release.json"
          upstream_notes_raw="$RUNNER_TEMP/upstream-release-notes-raw.md"
          upstream_notes="$RUNNER_TEMP/upstream-release-notes.md"

          curl -fsSL             -H 'Accept: application/vnd.github+json'             -H 'X-GitHub-Api-Version: 2022-11-28'             https://api.github.com/repos/YouROK/TorrServer/releases/latest             > "$upstream_release_json"

          upstream_tag="$(jq -r '.tag_name // empty' "$upstream_release_json")"
          upstream_name="$(jq -r '.name // .tag_name // empty' "$upstream_release_json")"
          upstream_url="$(jq -r '.html_url // empty' "$upstream_release_json")"

          jq -r '.body // ""' "$upstream_release_json" | sed 's/$//' > "$upstream_notes_raw"

          if [[ ! -s "$upstream_notes_raw" ]]; then
            printf '_No upstream release notes were provided._\n' > "$upstream_notes_raw"
          fi

          # Demote Markdown headings by one level so upstream notes nest cleanly
          # under our own "Upstream release notes" section.
          sed -E 's/^(#{1,5})([[:space:]])/#\1\2/' "$upstream_notes_raw" > "$upstream_notes"

          if [[ -z "$upstream_tag" || "$upstream_tag" != MatriX.* ]]; then
            echo "::error::Unexpected upstream release tag: ${upstream_tag:-<empty>}"
            exit 1
          fi

          package_version="$(tr -d '[:space:]' < torrserver/package-version.txt)"
          if [[ -z "$package_version" ]]; then
            echo "::error file=torrserver/package-version.txt::Package version is empty"
            exit 1
          fi

          target_version="${package_version}-${upstream_tag}"
          current_version="$(sed -n 's/^version: "\(.*\)"$/\1/p' torrserver/config.yaml)"

          echo "upstream_tag=$upstream_tag" >> "$GITHUB_OUTPUT"
          echo "upstream_name=$upstream_name" >> "$GITHUB_OUTPUT"
          echo "upstream_url=$upstream_url" >> "$GITHUB_OUTPUT"
          echo "package_version=$package_version" >> "$GITHUB_OUTPUT"
          echo "target_version=$target_version" >> "$GITHUB_OUTPUT"
          echo "current_version=$current_version" >> "$GITHUB_OUTPUT"

          {
            echo "## TorrServer build"
            echo
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| Upstream | $upstream_tag |"
            echo "| Upstream release | $upstream_url |"
            echo "| Target HA version | $target_version |"
            echo "| Current HA version | $current_version |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether target image already exists
        id: image
        shell: bash
        env:
          TARGET_VERSION: ${{ steps.versions.outputs.target_version }}
        run: |
          set -euo pipefail
          image="ghcr.io/olegg-mir/ha-torrserver:${TARGET_VERSION}"

          if docker manifest inspect "$image" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Image already exists: $image"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Image needs to be built: $image"
          fi

      - name: Decide whether to build
        id: decision
        shell: bash
        env:
          IMAGE_EXISTS: ${{ steps.image.outputs.exists }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "push" || "$IMAGE_EXISTS" != "true" ]]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout upstream TorrServer release
        if: steps.decision.outputs.build == 'true'
        uses: actions/checkout@v7.0.1
        with:
          repository: YouROK/TorrServer
          ref: ${{ steps.versions.outputs.upstream_tag }}
          path: torrserver/src
          fetch-depth: 1

      - name: Verify and apply Home Assistant patches
        id: patches
        if: steps.decision.outputs.build == 'true'
        shell: bash
        env:
          UPSTREAM_TAG: ${{ steps.versions.outputs.upstream_tag }}
          UPSTREAM_URL: ${{ steps.versions.outputs.upstream_url }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          patches=(torrserver/patches/*.patch)
          if [[ "${#patches[@]}" -eq 0 ]]; then
            echo "::error file=torrserver/patches::No patch files found"
            exit 1
          fi

          for patch in "${patches[@]}"; do
            echo "::group::Checking $patch"
            error_file="$(mktemp)"

            if ! git -C torrserver/src apply --check "$GITHUB_WORKSPACE/$patch" 2>"$error_file"; then
              echo "Patch validation failed for $patch against $UPSTREAM_TAG"
              cat "$error_file"
              echo "::error file=$patch::Patch does not apply cleanly to $UPSTREAM_TAG. Open the failed step log for git apply details."

              {
                echo
                echo "### Patch validation failed"
                echo
                echo "Upstream: $UPSTREAM_TAG"
                echo "Patch: $patch"
                echo
                echo "Error:"
                cat "$error_file"
              } >> "$GITHUB_STEP_SUMMARY"

              rm -f "$error_file"
              echo "::endgroup::"
              exit 1
            fi

            rm -f "$error_file"
            echo "::endgroup::"
          done

          for patch in "${patches[@]}"; do
            echo "Applying $patch"
            git -C torrserver/src apply "$GITHUB_WORKSPACE/$patch"
          done

          {
            echo
            echo "### Home Assistant patches"
            echo
            echo "Successfully validated and applied ${#patches[@]} patches to $UPSTREAM_TAG."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up QEMU
        if: steps.decision.outputs.build == 'true'
        uses: docker/setup-qemu-action@v4.2.0

      - name: Set up Docker Buildx
        if: steps.decision.outputs.build == 'true'
        uses: docker/setup-buildx-action@v4.2.0

      - name: Build and publish Home Assistant image
        id: build_image
        if: steps.decision.outputs.build == 'true'
        uses: docker/build-push-action@v7.3.0
        with:
          context: torrserver
          file: torrserver/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/olegg-mir/ha-torrserver:${{ steps.versions.outputs.target_version }}
          build-args: |
            TORRSERVER_VERSION=${{ steps.versions.outputs.upstream_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify target multi-arch image
        id: verify_image
        if: ${{ !cancelled() && (steps.decision.outputs.build != 'true' || steps.build_image.outcome == 'success') }}
        shell: bash
        env:
          TARGET_VERSION: ${{ steps.versions.outputs.target_version }}
        run: |
          set -euo pipefail

          image="ghcr.io/olegg-mir/ha-torrserver:${TARGET_VERSION}"
          manifest="$(docker manifest inspect "$image")"
          arches="$(printf '%s' "$manifest" | jq -r '.manifests[]?.platform.architecture // empty' | sort -u)"

          echo "Architectures in $image:"
          printf '%s\n' "$arches"

          if ! grep -qx 'amd64' <<<"$arches"; then
            echo "::error::Published image is missing amd64"
            exit 1
          fi

          if ! grep -qx 'arm64' <<<"$arches"; then
            echo "::error::Published image is missing arm64"
            exit 1
          fi

          {
            echo
            echo "### Container image"
            echo
            echo "$image is available for amd64 and arm64."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Update Home Assistant metadata
        id: metadata
        if: steps.verify_image.outcome == 'success'
        shell: bash
        env:
          TARGET_VERSION: ${{ steps.versions.outputs.target_version }}
          CURRENT_VERSION: ${{ steps.versions.outputs.current_version }}
          UPSTREAM_TAG: ${{ steps.versions.outputs.upstream_tag }}
        run: |
          set -euo pipefail

          if [[ "$CURRENT_VERSION" == "$TARGET_VERSION" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          sed -i "s/^version: .*/version: \"${TARGET_VERSION}\"/" torrserver/config.yaml

          today="$(date -u +%Y-%m-%d)"
          tmp="$(mktemp)"
          {
            printf '## %s - %s\n\n' "$TARGET_VERSION" "$today"
            printf 'Based on upstream [TorrServer %s](%s).\n\n' "$UPSTREAM_TAG" "$UPSTREAM_URL"
            printf '### Upstream release notes\n\n'
            cat "$RUNNER_TEMP/upstream-release-notes.md"
            printf '\n\n'
            cat torrserver/CHANGELOG.md
          } > "$tmp"
          mv "$tmp" torrserver/CHANGELOG.md

          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit metadata update
        if: steps.metadata.outputs.changed == 'true'
        shell: bash
        env:
          TARGET_VERSION: ${{ steps.versions.outputs.target_version }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add torrserver/config.yaml torrserver/CHANGELOG.md
          git commit -m "chore: update TorrServer to ${TARGET_VERSION}"
          git push

      - name: Publish GitHub Release
        id: release
        if: steps.verify_image.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_VERSION: ${{ steps.versions.outputs.target_version }}
          UPSTREAM_TAG: ${{ steps.versions.outputs.upstream_tag }}
          UPSTREAM_URL: ${{ steps.versions.outputs.upstream_url }}
        run: |
          set -euo pipefail

          notes_file="$(mktemp)"
          {
            printf '## HA-TorrServer %s\n\n' "$TARGET_VERSION"
            printf 'Home Assistant package based on upstream [YouROK/TorrServer %s](%s).\n\n' "$UPSTREAM_TAG" "$UPSTREAM_URL"
            printf '### Container image\n\n'
            printf 'Container image: ghcr.io/olegg-mir/ha-torrserver:%s\n\n' "$TARGET_VERSION"
            printf 'Architectures: amd64, arm64.\n\n'
            printf '### Home Assistant compatibility changes\n\n'
            printf '%s\n' '- M3U custom host support.'
            printf '%s\n' '- Home Assistant Ingress search and playlist fixes.'
            printf '%s\n' '- HTTPS poster URL handling.'
            printf '%s\n\n' '- Home Assistant configuration for authentication, Telegram, SSL, proxy and web access logging.'
            printf '### Upstream TorrServer release notes\n\n'
            cat "$RUNNER_TEMP/upstream-release-notes.md"
            printf '\n\n'
            printf 'HA-specific changes are adapted from [aatrubilin/hassio-torrserver](https://github.com/aatrubilin/hassio-torrserver).\n'
          } > "$notes_file"

          if gh release view "$TARGET_VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TARGET_VERSION" \
              --repo "$GITHUB_REPOSITORY" \
              --title "HA-TorrServer $TARGET_VERSION" \
              --notes-file "$notes_file"

            release_status="updated"
            echo "Release updated: $TARGET_VERSION"
          else
            gh release create "$TARGET_VERSION" \
              --repo "$GITHUB_REPOSITORY" \
              --target main \
              --title "HA-TorrServer $TARGET_VERSION" \
              --notes-file "$notes_file"

            release_status="created"
            echo "Release created: $TARGET_VERSION"
          fi

          rm -f "$notes_file"

          echo "result=$release_status" >> "$GITHUB_OUTPUT"

          {
            echo
            echo "### GitHub Release"
            echo
            echo "Release: $TARGET_VERSION"
            echo "Status: $release_status"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Workflow result
        if: always()
        shell: bash
        env:
          PATCH_RESULT: ${{ steps.patches.outcome }}
          BUILD_RESULT: ${{ steps.build_image.outcome }}
          IMAGE_RESULT: ${{ steps.verify_image.outcome }}
          METADATA_RESULT: ${{ steps.metadata.outcome }}
          RELEASE_RESULT: ${{ steps.release.outcome }}
        run: |
          {
            echo
            echo "### Workflow result"
            echo
            echo "| Stage | Result |"
            echo "| --- | --- |"
            echo "| Patch validation | $PATCH_RESULT |"
            echo "| Image build | $BUILD_RESULT |"
            echo "| Image verification | $IMAGE_RESULT |"
            echo "| HA metadata | $METADATA_RESULT |"
            echo "| GitHub Release | $RELEASE_RESULT |"
            echo
            echo "[Open this workflow run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
          } >> "$GITHUB_STEP_SUMMARY"
